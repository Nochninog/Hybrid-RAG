server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 21m;
    # DNS Docker обновляется после пересоздания прикладных контейнеров.
    resolver 127.0.0.11 valid=10s ipv6=off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 5s;
    proxy_next_upstream off;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"web"}';
    }

    location /api/knowledge/ {
        set $knowledge http://knowledge-service:8000;
        rewrite ^/api/knowledge/(.*)$ /$1 break;
        proxy_pass $knowledge;
        proxy_request_buffering off;
    }

    location /api/search/ {
        set $search http://search-service:8000;
        rewrite ^/api/search/(.*)$ /$1 break;
        proxy_pass $search;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
