x-app: &app
  restart: unless-stopped
  init: true
  environment:
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_DB: ${POSTGRES_DB}
    MINIO_URL: http://minio:9000
    MINIO_USERNAME: ${MINIO_USERNAME}
    MINIO_PASSWORD: ${MINIO_PASSWORD}
    WEAVIATE_HOST: weaviate
    WEAVIATE_HTTP_PORT: "8080"
    WEAVIATE_GRPC_PORT: "50051"
    CLOUD_RU_API_KEY: ${CLOUD_RU_API_KEY:-}
    GIGACHAT_CREDENTIALS: ${GIGACHAT_CREDENTIALS:-}
    GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
    GIGACHAT_CA_BUNDLE: ${CORPDB_GIGACHAT_CA_BUNDLE:-/certs/russian_trusted_root_ca_pem.crt}
  volumes:
    - ./data/certs:/certs:ro

services:
  web:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      knowledge-service:
        condition: service_healthy
      search-service:
        condition: service_healthy
    restart: unless-stopped
    init: true

  knowledge-service:
    <<: *app
    build:
      context: .
      target: knowledge
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
      weaviate:
        condition: service_started
    volumes:
      - ./data/certs:/certs:ro
      - knowledge_tokenizer_cache:/home/app/.cache/huggingface

  search-service:
    <<: *app
    build:
      context: .
      target: search
    ports:
      - "127.0.0.1:8002:8000"
    depends_on:
      db:
        condition: service_healthy
      weaviate:
        condition: service_started
    volumes:
      - ./data/certs:/certs:ro
      - search_tokenizer_cache:/home/app/.cache/huggingface

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USERNAME}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  db:
    image: postgres:17
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.40.1
    container_name: weaviate
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      CLUSTER_HOSTNAME: node1
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:50051:50051"
    volumes:
      - weaviate_data:/var/lib/weaviate
    restart: unless-stopped

volumes:
  knowledge_tokenizer_cache:
  search_tokenizer_cache:
  minio_data:
  postgres_data:
  weaviate_data:
